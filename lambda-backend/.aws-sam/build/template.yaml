AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Wellync Serverless Backend ($0 Base Cost) - DynamoDB Single-Table + Amazon
  Bedrock + AWS Lambda
Globals:
  Function:
    Timeout: 30
    MemorySize: 512
    Runtime: nodejs20.x
    Architectures:
    - arm64
Resources:
  HealthcareAgentTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: HealthcareAgentTable
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: PK
        AttributeType: S
      - AttributeName: SK
        AttributeType: S
      KeySchema:
      - AttributeName: PK
        KeyType: HASH
      - AttributeName: SK
        KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      Tags:
      - Key: Project
        Value: Wellync
      - Key: Environment
        Value: Production
  WellyncHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins:
        - '*'
        AllowMethods:
        - GET
        - POST
        - PUT
        - DELETE
        - OPTIONS
        AllowHeaders:
        - Content-Type
        - Authorization
        - X-Requested-With
  WellyncBackendFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: WellyncBackendFunction
      Handler: handler.handler
      Environment:
        Variables:
          DYNAMODB_TABLE:
            Ref: HealthcareAgentTable
          BEDROCK_CHEAP_MODEL: amazon.nova-micro-v1:0
          AWS_NODEJS_CONNECTION_REUSE_ENABLED: '1'
      Policies:
      - Statement:
        - Effect: Allow
          Action:
          - bedrock:InvokeModel
          Resource: '*'
      - DynamoDBCrudPolicy:
          TableName:
            Ref: HealthcareAgentTable
      Events:
        ProxyApi:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: WellyncHttpApi
            Path: /{proxy+}
            Method: ANY
        RootApi:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: WellyncHttpApi
            Path: /
            Method: ANY
    Metadata:
      SamResourceId: WellyncBackendFunction
Outputs:
  ApiEndpoint:
    Description: HTTP API Gateway endpoint URL ($0 Base Cost)
    Value:
      Fn::Sub: https://${WellyncHttpApi}.execute-api.${AWS::Region}.amazonaws.com
  DynamoDBTableName:
    Description: DynamoDB Single-Table Name
    Value:
      Ref: HealthcareAgentTable
